{% extends "base.html" %}

{% block content %}

<h2>Berita Terbaru</h2>

{% for post in posts %}

<div class="card">

    <h2>
        <a href="{{ post.get_absolute_url }}">
            {{ post.title }}
        </a>
    </h2>

    <small>✍ {{ post.author }}</small>

    <p>{{ post.body|truncatewords:30 }}</p>

    <a class="button" href="{{ post.get_absolute_url }}">
        Baca Selengkapnya
    </a>

</div>

{% empty %}

<h3>Belum ada berita.</h3>

{% endfor %}

{% endblock content %}
